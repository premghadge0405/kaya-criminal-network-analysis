<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Authentication | Cybercell</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        * { box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        body { 
            background-color: #050811; color: #00ff66; margin: 0; 
            display: flex; align-items: center; justify-content: center; height: 100vh; 
            border: 2px solid #00ff66; position: relative;
        }
        body::before { 
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 1; pointer-events: none; opacity: 0.8; 
        }
        .login-box {
            position: relative; z-index: 10; width: 400px; padding: 30px;
            background: #02050b; border: 1px solid #00ff66; box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }
        h2 { margin-top: 0; font-size: 24px; border-bottom: 2px dashed #00ff66; padding-bottom: 10px; }
        label { display: block; margin-top: 20px; font-size: 14px; color: #00aa66; }
        input {
            width: 100%; padding: 12px; margin-top: 5px; background: #091724; 
            border: 1px solid #00aa66; color: #00ff66; font-size: 16px;
        }
        input:focus { outline: none; box-shadow: 0 0 10px rgba(0, 255, 102, 0.5); border-color: #00ff66; }
        button {
            width: 100%; padding: 15px; margin-top: 30px; background: #00aa66; color: #050811;
            border: none; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        button:hover { background: #00ff66; box-shadow: 0 0 15px rgba(0, 255, 102, 0.7); }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>RESTRICTED ACCESS</h2>
        <form action="/login" method="POST">
            <label>AGENT ID NO:</label>
            <input type="text" name="username" required autocomplete="off" placeholder="Enter Agent ID...">
            
            <label>PASSCODE:</label>
            <input type="password" name="password" required placeholder="••••••••">
            
            <button type="submit">Decrypt & Authenticate</button>
        </form>
    </div>
</body>
</html>
